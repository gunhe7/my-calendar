        <button type="button" class="liquid-surface liquid-orb" id="addOrbBtn" aria-label="새 일정 추가" title="새 일정 (N)">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </nav>
    </div>

    <!-- Day Overview Modal (for +N overflow or date inspection) -->
    <div class="modal-backdrop" id="dayOverviewBackdrop" role="dialog" aria-modal="true" aria-labelledby="dayOverviewTitle">
      <div class="sheet">
        <div class="sheet-header">
          <span class="sheet-title tabular" id="dayOverviewTitle">일정 목록</span>
          <button type="button" class="sheet-action" id="dayOverviewCloseBtn">닫기</button>
        </div>
        <div class="sheet-body" id="dayOverviewBody"></div>
      </div>
    </div>

    <!-- Event Detail Modal -->
    <div class="modal-backdrop" id="detailBackdrop" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="sheet">
        <div class="sheet-header">
          <span class="sheet-title">일정 세부사항</span>
          <button type="button" class="sheet-action" id="detailCloseBtn">닫기</button>
        </div>
        <div class="sheet-body" id="detailBody"></div>
      </div>
    </div>

    <!-- Event Editor Modal -->
    <div class="modal-backdrop" id="editorBackdrop" role="dialog" aria-modal="true" aria-labelledby="editorSheetTitle">
      <form class="sheet" id="eventForm">
        <div class="sheet-header">
          <button type="button" class="sheet-action" id="editorCancelBtn">취소</button>
          <span class="sheet-title" id="editorSheetTitle">새로운 일정</span>
          <button type="submit" class="sheet-action primary" id="editorSaveBtn">저장</button>
        </div>
        <div class="sheet-body">
          <input type="text" class="field-title-input" id="fieldTitle" placeholder="제목" required autocomplete="off">

          <div class="cat-pills" id="catPills"></div>

          <div class="form-group">
            <div class="form-row">
              <span class="form-label">하루 종일</span>
              <button type="button" class="switch" id="fieldAllDay" role="switch" aria-checked="false"></button>
            </div>
            <div class="form-row">
              <label class="form-label" for="fieldDate">날짜</label>
              <input type="date" class="form-input tabular" id="fieldDate" required>
            </div>
            <div class="form-row" id="startTimeRow">
              <label class="form-label" for="fieldStart">시작</label>
              <input type="time" class="form-input tabular" id="fieldStart" value="10:00">
            </div>
            <div class="form-row" id="endTimeRow">
              <label class="form-label" for="fieldEnd">종료</label>
              <input type="time" class="form-input tabular" id="fieldEnd" value="11:00">
            </div>
          </div>

          <div class="form-group">
            <div class="form-row">
              <label class="form-label" for="fieldLocation">위치</label>
              <input type="text" class="form-input" id="fieldLocation" placeholder="장소 또는 링크" autocomplete="off">
            </div>
            <div class="form-row" style="align-items: flex-start;">
              <textarea class="form-textarea" id="fieldNotes" placeholder="메모"></textarea>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'apple_lg_calendar_v3';
      const THEME_KEY = 'apple_lg_calendar_theme';

      const CATEGORIES = {
        work: { id: 'work', name: '업무', color: 'var(--cat-work)', bg: 'var(--cat-work-bg)' },
        personal: { id: 'personal', name: '개인', color: 'var(--cat-personal)', bg: 'var(--cat-personal-bg)' },
        family: { id: 'family', name: '가족', color: 'var(--cat-family)', bg: 'var(--cat-family-bg)' },
        health: { id: 'health', name: '건강', color: 'var(--cat-health)', bg: 'var(--cat-health-bg)' }
      };

      const WEEKDAYS_KO = ['일', '월', '화', '수', '목', '금', '토'];

      function toDateStr(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function parseDateStr(str) {
        const [y, m, d] = str.split('-').map(Number);
        return new Date(y, m - 1, d);
      }

      function addDays(d, n) {
        return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
      }

      function formatTimeKo(hhmm) {
        if (!hhmm) return '';
        const [h, m] = hhmm.split(':').map(Number);
        const period = h < 12 ? '오전' : '오후';
        const h12 = h % 12 === 0 ? 12 : h % 12;
        return `${period} ${h12}:${String(m).padStart(2, '0')}`;
      }

      function formatShortTime(hhmm) {
        if (!hhmm) return '';
        const [h, m] = hhmm.split(':').map(Number);
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      }

      function timeToMinutes(hhmm) {
        if (!hhmm) return 0;
        const [h, m] = hhmm.split(':').map(Number);
        return h * 60 + m;
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      const NOW = new Date();
      const TODAY_STR = toDateStr(NOW);

      const state = {
        view: 'home', // 'home' | 'month' | 'week' | 'day' | 'agenda'
        cursor: new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate()),
        selectedDate: TODAY_STR,
        events: [],
        visibleCategories: { work: true, personal: true, family: true, health: true },
        searchOpen: false,
        searchQuery: '',
        editingId: null,
        detailId: null,
        editorCategory: 'work',
        editorAllDay: false,
        lastDeleted: null,
        toastTimer: null,
        scrollTimer: null
      };

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              state.events = parsed;
              return;
            }
          }
        } catch (_) {}
        state.events = [];
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.events));
        } catch (_) {}
      }

      function loadTheme() {
        let theme = 'light';
        try {
          const saved = localStorage.getItem(THEME_KEY);
          if (saved === 'dark' || saved === 'light') {
            theme = saved;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (_) {}
        applyTheme(theme, false);
      }

      function applyTheme(theme, persist = true) {
        document.documentElement.setAttribute('data-theme', theme);
        const tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute('content', theme === 'dark' ? '#0a0a0c' : '#ffffff');
        const icon = document.getElementById('themeIcon');
        if (theme === 'dark') {
          icon.innerHTML = '<circle cx="12" cy="12" r="4.5"/><line x1="12" y1="2.5" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="21.5"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="2.5" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="21.5" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
        } else {
          icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
        }
        if (persist) {
          try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
        }
      }

      // DOM refs
      const stageEl = document.getElementById('stage');
      const periodTitleEl = document.getElementById('periodTitle');
      const periodSubEl = document.getElementById('periodSub');
      const periodNavGroup = document.getElementById('periodNavGroup');
      const prevBtn = document.getElementById('prevBtn');
      const todayBtn = document.getElementById('todayBtn');
      const nextBtn = document.getElementById('nextBtn');
      const filterBtn = document.getElementById('filterBtn');
      const filterPopover = document.getElementById('filterPopover');
      const filterListEl = document.getElementById('filterList');
      const themeBtn = document.getElementById('themeBtn');
      const brandLogoBtn = document.getElementById('brandLogoBtn');

      const liquidDock = document.getElementById('liquidDock');
      const liquidTabsEl = document.getElementById('liquidTabs');
      const liquidPill = document.getElementById('liquidPill');
      const searchOrbBtn = document.getElementById('searchOrbBtn');
      const addOrbBtn = document.getElementById('addOrbBtn');
      const searchInput = document.getElementById('searchInput');
      const searchCloseBtn = document.getElementById('searchCloseBtn');
      const searchResultsPanel = document.getElementById('searchResultsPanel');

      const dayOverviewBackdrop = document.getElementById('dayOverviewBackdrop');
      const dayOverviewTitle = document.getElementById('dayOverviewTitle');
      const dayOverviewBody = document.getElementById('dayOverviewBody');
      const dayOverviewCloseBtn = document.getElementById('dayOverviewCloseBtn');

      const detailBackdrop = document.getElementById('detailBackdrop');
      const detailBody = document.getElementById('detailBody');
      const detailCloseBtn = document.getElementById('detailCloseBtn');

      const editorBackdrop = document.getElementById('editorBackdrop');
      const eventForm = document.getElementById('eventForm');
      const editorSheetTitle = document.getElementById('editorSheetTitle');
      const editorCancelBtn = document.getElementById('editorCancelBtn');
      const fieldTitle = document.getElementById('fieldTitle');
      const catPillsEl = document.getElementById('catPills');
      const fieldAllDay = document.getElementById('fieldAllDay');
      const fieldDate = document.getElementById('fieldDate');
      const fieldStart = document.getElementById('fieldStart');
      const fieldEnd = document.getElementById('fieldEnd');
      const startTimeRow = document.getElementById('startTimeRow');
      const endTimeRow = document.getElementById('endTimeRow');
      const fieldLocation = document.getElementById('fieldLocation');
      const fieldNotes = document.getElementById('fieldNotes');

      const undoToast = document.getElementById('undoToast');
      const toastMsg = document.getElementById('toastMsg');
      const undoBtn = document.getElementById('undoBtn');

      function getVisibleEvents() {
        return state.events
          .filter((ev) => state.visibleCategories[ev.category])
          .sort((a, b) => {
            if (a.date !== b.date) return a.date.localeCompare(b.date);
            if (a.allDay !== b.allDay) return a.allDay ? -1 : 1;
            return (a.start || '').localeCompare(b.start || '');
          });
      }

      function getEventsByDate(dateStr) {
        return getVisibleEvents().filter((ev) => ev.date === dateStr);
      }

      function updateHeader() {
        const y = state.cursor.getFullYear();
        const m = state.cursor.getMonth() + 1;
        const d = state.cursor.getDate();

        periodNavGroup.style.display = state.view === 'home' ? 'none' : 'inline-flex';

        if (state.view === 'home') {
          periodTitleEl.textContent = '홈';
          periodSubEl.textContent = `${NOW.getFullYear()}년 ${NOW.getMonth() + 1}월`;
        } else if (state.view === 'month') {
          periodTitleEl.textContent = `${y}년 ${m}월`;
          periodSubEl.textContent = '';
        } else if (state.view === 'week') {
          const start = addDays(state.cursor, -state.cursor.getDay());
          const end = addDays(start, 6);
          const sameMonth = start.getMonth() === end.getMonth();
          periodTitleEl.textContent = sameMonth
            ? `${start.getFullYear()}년 ${start.getMonth() + 1}월`
            : `${start.getMonth() + 1}월 – ${end.getMonth() + 1}월`;
          periodSubEl.textContent = `${start.getDate()}일 – ${end.getDate()}일`;
        } else if (state.view === 'day') {
          const dow = WEEKDAYS_KO[state.cursor.getDay()];
          periodTitleEl.textContent = `${m}월 ${d}일 ${dow}요일`;
          periodSubEl.textContent = `${y}년`;
        } else {
          periodTitleEl.textContent = `${y}년 ${m}월`;
          periodSubEl.textContent = '전체 일정';
        }
      }

      // ==================== HOME VIEW ====================
      function renderHomeView() {
        const todayDow = WEEKDAYS_KO[NOW.getDay()];
        const todayTitle = `${NOW.getMonth() + 1}월 ${NOW.getDate()}일 ${todayDow}요일`;
        const todayEvents = getEventsByDate(TODAY_STR);

        const upcomingEvents = getVisibleEvents().filter((ev) => ev.date > TODAY_STR).slice(0, 8);
        const upcomingGrouped = new Map();
        for (const ev of upcomingEvents) {
          if (!upcomingGrouped.has(ev.date)) upcomingGrouped.set(ev.date, []);
          upcomingGrouped.get(ev.date).push(ev);
        }

        const todayListHtml = todayEvents.length
          ? todayEvents.map(renderAgendaCardHtml).join('')
          : `<div class="home-empty-card">
              <div class="home-empty-text">오늘 등록된 일정이 없습니다.</div>
              <button type="button" class="home-empty-btn" id="homeAddTodayBtn">오늘 일정 추가</button>
            </div>`;

        let upcomingHtml = '';
        if (upcomingGrouped.size === 0) {
          upcomingHtml = `<div class="home-empty-card">
            <div class="home-empty-text">예정된 다음 일정이 없습니다.</div>
          </div>`;
        } else {
          for (const [ds, list] of upcomingGrouped.entries()) {
            const d = parseDateStr(ds);
            const label = `${d.getMonth() + 1}월 ${d.getDate()}일 ${WEEKDAYS_KO[d.getDay()]}요일`;
            upcomingHtml += `
              <div style="margin-bottom:10px;">
                <div style="font-size:12px;font-weight:600;color:var(--text-secondary);padding:4px 12px 4px;" class="tabular">${label}</div>
                ${list.map(renderAgendaCardHtml).join('')}
              </div>`;
          }
        }

        // Mini month calendar on right column
        const y = NOW.getFullYear();
        const m = NOW.getMonth();
        const first = new Date(y, m, 1);
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const startOffset = first.getDay();
        const totalCells = (startOffset + daysInMonth) <= 35 ? 35 : 42;
        const start = new Date(y, m, 1 - startOffset);
        const eventDates = new Set(getVisibleEvents().map((e) => e.date));

        let miniCells = WEEKDAYS_KO.map((w) => `<div class="mini-dow">${w}</div>`).join('');
        for (let i = 0; i < totalCells; i++) {
          const cd = addDays(start, i);
          const cds = toDateStr(cd);
          const cls = [
            'mini-day', 'tabular',
            cd.getMonth() !== m ? 'other' : '',
            cds === TODAY_STR ? 'today' : '',
            cds === state.selectedDate ? 'selected' : '',
            eventDates.has(cds) ? 'has-ev' : ''
          ].filter(Boolean).join(' ');
          miniCells += `<button type="button" class="${cls}" data-home-day="${cds}">${cd.getDate()}</button>`;
        }

        const catRowsHtml = Object.values(CATEGORIES).map((cat) => {
          const count = state.events.filter((e) => e.category === cat.id).length;
          return `
            <button type="button" class="home-cat-row" data-home-cat="${cat.id}">
              <span class="home-cat-dot" style="background:${cat.color}"></span>
              <span>${cat.name}</span>
              <span class="home-cat-count tabular">${count}</span>
            </button>`;
        }).join('');

        stageEl.innerHTML = `
          <div class="home-view" data-scroll-watch>
            <div class="home-inner">
              <div class="home-hero">
                <div>
                  <div class="home-date-kicker tabular">오늘 · ${NOW.getFullYear()}년</div>
                  <h2 class="home-date-big tabular">${todayTitle}</h2>
                </div>
                <form class="home-quick-form" id="homeQuickForm">
                  <input type="text" class="home-quick-input" id="homeQuickInput" placeholder="오늘 일정 빠르게 입력..." autocomplete="off">
                  <button type="submit" class="home-quick-submit">추가</button>
                </form>
              </div>

              <div class="home-grid">
                <div class="home-col">
                  <section>
                    <div class="home-section-head">
                      <span class="home-section-title tabular">오늘의 일정 (${todayEvents.length})</span>
                      <button type="button" class="home-text-btn" id="homeGoDayBtn">일간 보기</button>
                    </div>
                    <div class="home-panel">${todayListHtml}</div>
                  </section>

                  <section>
                    <div class="home-section-head">
                      <span class="home-section-title">다가오는 일정</span>
                      <button type="button" class="home-text-btn" id="homeGoAgendaBtn">전체 보기</button>
                    </div>
                    <div class="home-panel">${upcomingHtml}</div>
                  </section>
                </div>

                <div class="home-col">
                  <section>
                    <div class="home-section-head">
                      <span class="home-section-title tabular">${y}년 ${m + 1}월</span>
                      <button type="button" class="home-text-btn" id="homeGoMonthBtn">달력 크게 보기</button>
                    </div>
                    <div class="home-panel">
                      <div class="mini-cal-grid">${miniCells}</div>
                    </div>
                  </section>

                  <section>
                    <div class="home-section-head">
                      <span class="home-section-title">내 캘린더</span>
                    </div>
                    <div class="home-panel" style="padding:8px;">
                      <div class="home-cat-list">${catRowsHtml}</div>
                    </div>
                  </section>
                </div>
              </div>
            </div>
          </div>`;

        bindStageEvents();

        const quickForm = document.getElementById('homeQuickForm');
        const quickInput = document.getElementById('homeQuickInput');
        if (quickForm && quickInput) {
          quickForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = quickInput.value.trim();
            if (!title) {
              openEditorModal(null, TODAY_STR);
              return;
            }
            const nextHour = Math.min(22, NOW.getHours() + 1);
            const payload = {
              id: `ev-${Date.now()}`,
              title,
              date: TODAY_STR,
              start: `${String(nextHour).padStart(2, '0')}:00`,
              end: `${String(Math.min(23, nextHour + 1)).padStart(2, '0')}:00`,
              allDay: false,
              category: 'personal',
              location: '',
              notes: ''
            };
            state.events.push(payload);
            state.visibleCategories[payload.category] = true;
            saveState();
            render();
          });
        }

        const addTodayBtn = document.getElementById('homeAddTodayBtn');
        if (addTodayBtn) {
          addTodayBtn.addEventListener('click', () => openEditorModal(null, TODAY_STR));
        }

        const goDayBtn = document.getElementById('homeGoDayBtn');
        if (goDayBtn) {
          goDayBtn.addEventListener('click', () => {
            state.cursor = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
            state.selectedDate = TODAY_STR;
            setView('day');
          });
        }

        const goAgendaBtn = document.getElementById('homeGoAgendaBtn');
        if (goAgendaBtn) {
          goAgendaBtn.addEventListener('click', () => setView('agenda'));
        }

        const goMonthBtn = document.getElementById('homeGoMonthBtn');
        if (goMonthBtn) {
          goMonthBtn.addEventListener('click', () => setView('month'));
        }

        stageEl.querySelectorAll('[data-home-day]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const ds = btn.getAttribute('data-home-day');
            state.selectedDate = ds;
            state.cursor = parseDateStr(ds);
            openDayOverviewModal(ds);
          });
        });

        stageEl.querySelectorAll('[data-home-cat]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const catId = btn.getAttribute('data-home-cat');
            openEditorModal(null, TODAY_STR, '10:00', '11:00', catId);
          });
        });
      }

      // ==================== MONTH VIEW (AT-A-GLANCE) ====================
      function renderMonthView() {
        const y = state.cursor.getFullYear();
        const m = state.cursor.getMonth();
        const firstOfMonth = new Date(y, m, 1);
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const startOffset = firstOfMonth.getDay();
        const rows = (startOffset + daysInMonth) <= 35 ? 5 : 6;
        const totalCells = rows * 7;
        const gridStart = new Date(y, m, 1 - startOffset);

        const eventsMap = {};
        for (const ev of getVisibleEvents()) {
          if (!eventsMap[ev.date]) eventsMap[ev.date] = [];
          eventsMap[ev.date].push(ev);
        }

        let weekdayHtml = '';
        WEEKDAYS_KO.forEach((day, idx) => {
          weekdayHtml += `<div class="weekday-cell${idx === 0 ? ' sun' : ''}">${day}</div>`;
        });

        let cellsHtml = '';
        for (let i = 0; i < totalCells; i++) {
          const cellDate = addDays(gridStart, i);
          const dateStr = toDateStr(cellDate);
          const isOther = cellDate.getMonth() !== m;
          const isToday = dateStr === TODAY_STR;
          const isSelected = dateStr === state.selectedDate;
          const isWeekend = cellDate.getDay() === 0 || cellDate.getDay() === 6;
          const dayEvents = eventsMap[dateStr] || [];
          const showMonthTag = cellDate.getDate() === 1 && isOther;

          const visibleChips = dayEvents.slice(0, 4).map((ev) => {
            const cat = CATEGORIES[ev.category] || CATEGORIES.work;
            const timeTxt = ev.allDay ? '' : `<span class="event-chip-time tabular">${formatShortTime(ev.start)}</span>`;
            const textColor = ev.allDay ? cat.color : 'var(--text)';
            return `
              <button type="button" class="event-chip${ev.allDay ? ' all-day' : ''}" data-event-id="${ev.id}" style="background:${cat.bg}; border-left-color:${cat.color}; color:${textColor};">
                <span class="event-chip-title">${escapeHtml(ev.title)}</span>
                ${timeTxt}
              </button>`;
          }).join('');

          const moreHtml = dayEvents.length > 4
            ? `<button type="button" class="more-link tabular" data-more-date="${dateStr}">+${dayEvents.length - 4}개 더보기</button>`
            : '';

          cellsHtml += `
            <div class="day-cell${isOther ? ' other-month' : ''}${isToday ? ' today' : ''}${isSelected ? ' selected' : ''}${isWeekend ? ' weekend' : ''}" data-date="${dateStr}">
              <div class="day-cell-top">
                ${showMonthTag
                  ? `<span class="day-month-tag">${cellDate.getMonth() + 1}월</span>`
                  : `<button type="button" class="day-quick-add" data-quick-add-date="${dateStr}" aria-label="${dateStr} 일정 추가" title="일정 추가">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>`
                }
                <span class="day-num tabular">${cellDate.getDate()}</span>
              </div>
              <div class="day-events">${visibleChips}${moreHtml}</div>
            </div>`;
        }

        stageEl.innerHTML = `
          <div class="month-view">
            <div class="weekday-row">${weekdayHtml}</div>
            <div class="month-grid-wrap" data-scroll-watch>
              <div class="month-grid" style="--month-rows:${rows}">${cellsHtml}</div>
            </div>
          </div>`;

        bindStageEvents();
      }

      // ==================== WEEK VIEW ====================
      function renderWeekView() {
        const weekStart = addDays(state.cursor, -state.cursor.getDay());
        const days = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));

        let headHtml = `<div class="week-corner">GMT+9</div>`;
        let alldayHtml = `<div class="week-allday-label">종일</div>`;
        let hasAnyAllDay = false;

        days.forEach((d) => {
          const ds = toDateStr(d);
          const isToday = ds === TODAY_STR;
          const isSun = d.getDay() === 0;
          headHtml += `
            <div class="week-day-head${isToday ? ' today' : ''}${isSun ? ' sun' : ''}" data-jump-day="${ds}">
              <div class="week-dow">${WEEKDAYS_KO[d.getDay()]}</div>
              <div class="week-date-num tabular">${d.getDate()}</div>
            </div>`;

          const dayAllDay = getEventsByDate(ds).filter((ev) => ev.allDay);
          if (dayAllDay.length) hasAnyAllDay = true;
          const chips = dayAllDay.map((ev) => {
            const cat = CATEGORIES[ev.category] || CATEGORIES.work;
            return `<button type="button" class="event-chip all-day" data-event-id="${ev.id}" style="background:${cat.bg};border-left-color:${cat.color};color:${cat.color};"><span class="event-chip-title">${escapeHtml(ev.title)}</span></button>`;
          }).join('');
          alldayHtml += `<div class="week-allday-cell">${chips}</div>`;
        });

        let gutterHtml = '';
        for (let h = 1; h < 24; h++) {
          gutterHtml += `<div class="time-label tabular" style="top:${h * 60}px">${String(h).padStart(2, '0')}:00</div>`;
        }

        const nowMins = NOW.getHours() * 60 + NOW.getMinutes();

        let colsHtml = '';
        days.forEach((d) => {
          const ds = toDateStr(d);
          const isWeekend = d.getDay() === 0 || d.getDay() === 6;
          const isToday = ds === TODAY_STR;

          let slotsHtml = '';
          for (let h = 0; h < 24; h++) {
            slotsHtml += `<div class="hour-slot" data-slot-date="${ds}" data-slot-hour="${h}"></div>`;
          }

          const timed = getEventsByDate(ds).filter((ev) => !ev.allDay);
          const evBlocks = timed.map((ev) => {
            const startM = timeToMinutes(ev.start || '09:00');
            const endM = Math.max(startM + 30, timeToMinutes(ev.end || '10:00'));
            const top = startM;
            const height = Math.max(26, endM - startM);
            const cat = CATEGORIES[ev.category] || CATEGORIES.work;
            return `
              <button type="button" class="time-event" data-event-id="${ev.id}"
                style="top:${top}px; height:${height}px; background:${cat.bg}; border-left-color:${cat.color}; color:var(--text);">
                <div class="time-event-title">${escapeHtml(ev.title)}</div>
                ${height >= 38 ? `<div class="time-event-meta tabular">${formatShortTime(ev.start)} – ${formatShortTime(ev.end)}</div>` : ''}
              </button>`;
          }).join('');

          const nowLineHtml = isToday ? `<div class="now-line" style="top:${nowMins}px"></div>` : '';
          colsHtml += `<div class="time-col${isWeekend ? ' weekend' : ''}">${slotsHtml}${evBlocks}${nowLineHtml}</div>`;
        });

        stageEl.innerHTML = `
          <div class="week-view">
            <div class="week-header">${headHtml}</div>
            ${hasAnyAllDay ? `<div class="week-allday-row">${alldayHtml}</div>` : ''}
            <div class="timegrid-scroll" id="timegridScroll" data-scroll-watch>
              <div class="timegrid-body">
                <div class="time-gutter">${gutterHtml}</div>
                ${colsHtml}
              </div>
            </div>
          </div>`;

        bindStageEvents();
        const scroller = document.getElementById('timegridScroll');
        if (scroller) scroller.scrollTop = 450;
      }

      // ==================== DAY VIEW ====================
      function renderDayView() {
        const ds = toDateStr(state.cursor);
        state.selectedDate = ds;
        const dayEvents = getEventsByDate(ds);
        const allDayEvents = dayEvents.filter((ev) => ev.allDay);
        const timedEvents = dayEvents.filter((ev) => !ev.allDay);

        let gutterHtml = '';
        for (let h = 1; h < 24; h++) {
          gutterHtml += `<div class="time-label tabular" style="top:${h * 60}px">${String(h).padStart(2, '0')}:00</div>`;
        }

        let slotsHtml = '';
        for (let h = 0; h < 24; h++) {
          slotsHtml += `<div class="hour-slot" data-slot-date="${ds}" data-slot-hour="${h}"></div>`;
        }

        const evBlocks = timedEvents.map((ev) => {
          const startM = timeToMinutes(ev.start || '09:00');
          const endM = Math.max(startM + 30, timeToMinutes(ev.end || '10:00'));
          const height = Math.max(30, endM - startM);
          const cat = CATEGORIES[ev.category] || CATEGORIES.work;
          return `
            <button type="button" class="time-event" data-event-id="${ev.id}"
              style="top:${startM}px; height:${height}px; left:8px; right:14px; background:${cat.bg}; border-left-color:${cat.color}; padding:6px 10px;">
              <div class="time-event-title">${escapeHtml(ev.title)}</div>
              <div class="time-event-meta tabular">${formatTimeKo(ev.start)} – ${formatTimeKo(ev.end)}${ev.location ? ' · ' + escapeHtml(ev.location) : ''}</div>
            </button>`;
        }).join('');

        const nowMins = NOW.getHours() * 60 + NOW.getMinutes();
        const nowLineHtml = ds === TODAY_STR ? `<div class="now-line" style="top:${nowMins}px"></div>` : '';

        const allDayBarHtml = allDayEvents.length
          ? `<div class="day-allday-bar">
              <span class="day-allday-tag">종일</span>
              ${allDayEvents.map((ev) => {
                const cat = CATEGORIES[ev.category] || CATEGORIES.work;
                return `<button type="button" class="event-chip all-day" style="width:auto;background:${cat.bg};border-left-color:${cat.color};color:${cat.color};" data-event-id="${ev.id}">${escapeHtml(ev.title)}</button>`;
              }).join('')}
            </div>`
          : '';

        const y = state.cursor.getFullYear();
        const m = state.cursor.getMonth();
        const first = new Date(y, m, 1);
        const start = new Date(y, m, 1 - first.getDay());
        const eventDates = new Set(getVisibleEvents().map((e) => e.date));

        let miniCells = WEEKDAYS_KO.map((w) => `<div class="mini-dow">${w}</div>`).join('');
        for (let i = 0; i < 42; i++) {
          const cd = addDays(start, i);
          const cds = toDateStr(cd);
          const cls = [
            'mini-day', 'tabular',
            cd.getMonth() !== m ? 'other' : '',
            cds === TODAY_STR ? 'today' : '',
            cds === ds ? 'selected' : '',
            eventDates.has(cds) ? 'has-ev' : ''
          ].filter(Boolean).join(' ');
          miniCells += `<button type="button" class="${cls}" data-jump-day="${cds}">${cd.getDate()}</button>`;
        }

        const asideListHtml = dayEvents.length
          ? dayEvents.map(renderAgendaCardHtml).join('')
          : `<div class="empty-state" style="padding: 24px 8px;">등록된 일정이 없습니다</div>`;

        stageEl.innerHTML = `
          <div class="day-view">
            <div class="day-main">
              ${allDayBarHtml}
              <div class="timegrid-scroll" id="timegridScroll" data-scroll-watch>
                <div class="day-timegrid-body">
                  <div class="time-gutter">${gutterHtml}</div>
                  <div class="time-col" style="border-right:none;">${slotsHtml}${evBlocks}${nowLineHtml}</div>
                </div>
              </div>
            </div>
            <aside class="day-aside" data-scroll-watch>
              <div>
                <div class="mini-cal-header">
                  <span class="mini-cal-title tabular">${y}년 ${m + 1}월</span>
                </div>
                <div class="mini-cal-grid">${miniCells}</div>
              </div>
              <div>
                <div class="aside-section-title">이날의 일정 (${dayEvents.length})</div>
                ${asideListHtml}
              </div>
            </aside>
          </div>`;

        bindStageEvents();
        const scroller = document.getElementById('timegridScroll');
        if (scroller) scroller.scrollTop = 450;
      }

      function renderAgendaCardHtml(ev) {
        const cat = CATEGORIES[ev.category] || CATEGORIES.work;
        const timeCol = ev.allDay
          ? `<span>하루 종일</span>`
          : `<span class="tabular">${formatShortTime(ev.start)}</span><span class="tabular" style="opacity:0.65">${formatShortTime(ev.end)}</span>`;
        const metaParts = [cat.name];
        if (ev.location) metaParts.push(ev.location);
        return `
          <button type="button" class="agenda-card" data-event-id="${ev.id}">
            <span class="agenda-bar" style="background:${cat.color}"></span>
            <span class="agenda-time">${timeCol}</span>
            <span class="agenda-info">
              <span class="agenda-title">${escapeHtml(ev.title)}</span>
              <span class="agenda-meta">${escapeHtml(metaParts.join(' · '))}</span>
            </span>
          </button>`;
      }

      function renderAgendaView() {
        const y = state.cursor.getFullYear();
        const m = state.cursor.getMonth();
        const monthPrefix = `${y}-${String(m + 1).padStart(2, '0')}`;
        const events = getVisibleEvents().filter((ev) => ev.date.startsWith(monthPrefix));

        const grouped = new Map();
        for (const ev of events) {
          if (!grouped.has(ev.date)) grouped.set(ev.date, []);
          grouped.get(ev.date).push(ev);
        }

        let contentHtml = '';
        if (grouped.size === 0) {
          contentHtml = `<div class="empty-state">${y}년 ${m + 1}월에 등록된 일정이 없습니다.<br><button type="button" class="home-empty-btn" id="agendaEmptyAddBtn" style="margin-top:14px;">새 일정 추가</button></div>`;
        } else {
          for (const [dateStr, list] of grouped.entries()) {
            const d = parseDateStr(dateStr);
            const isToday = dateStr === TODAY_STR;
            const headMain = `${d.getMonth() + 1}월 ${d.getDate()}일 ${WEEKDAYS_KO[d.getDay()]}요일`;
            const headSub = isToday ? '오늘' : '';
            contentHtml += `
              <section class="agenda-group">
                <div class="agenda-date-head${isToday ? ' is-today' : ''}">
                  <span class="agenda-date-main tabular">${headMain}</span>
                  ${headSub ? `<span class="agenda-date-sub">${headSub}</span>` : ''}
                </div>
                ${list.map(renderAgendaCardHtml).join('')}
              </section>`;
          }
        }

        stageEl.innerHTML = `
          <div class="agenda-view" data-scroll-watch>
            <div class="agenda-inner">${contentHtml}</div>
          </div>`;

        bindStageEvents();
        const addBtn = document.getElementById('agendaEmptyAddBtn');
        if (addBtn) {
          addBtn.addEventListener('click', () => openEditorModal(null, state.selectedDate));
        }
      }

      function render() {
        updateHeader();
        if (state.view === 'home') renderHomeView();
        else if (state.view === 'month') renderMonthView();
        else if (state.view === 'week') renderWeekView();
        else if (state.view === 'day') renderDayView();
        else renderAgendaView();

        updateFilterPopover();
        updateLiquidPill(false);
      }

      function bindStageEvents() {
        stageEl.querySelectorAll('[data-event-id]').forEach((el) => {
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            openDetailModal(el.getAttribute('data-event-id'));
          });
        });

        stageEl.querySelectorAll('[data-quick-add-date]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const ds = btn.getAttribute('data-quick-add-date');
            state.selectedDate = ds;
            openEditorModal(null, ds);
          });
        });

        stageEl.querySelectorAll('[data-more-date]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            openDayOverviewModal(btn.getAttribute('data-more-date'));
          });
        });

        stageEl.querySelectorAll('.day-cell').forEach((cell) => {
          cell.addEventListener('click', () => {
            const ds = cell.getAttribute('data-date');
            state.selectedDate = ds;
            const clicked = parseDateStr(ds);
            if (clicked.getMonth() !== state.cursor.getMonth()) {
              state.cursor = clicked;
            }
            renderMonthView();
          });
          cell.addEventListener('dblclick', () => {
            openEditorModal(null, cell.getAttribute('data-date'));
          });
        });

        stageEl.querySelectorAll('[data-jump-day]').forEach((el) => {
          el.addEventListener('click', () => {
            const ds = el.getAttribute('data-jump-day');
            state.cursor = parseDateStr(ds);
            state.selectedDate = ds;
            setView('day');
          });
        });

        stageEl.querySelectorAll('[data-slot-date]').forEach((slot) => {
          slot.addEventListener('click', () => {
            const ds = slot.getAttribute('data-slot-date');
            const h = Number(slot.getAttribute('data-slot-hour'));
            const startStr = `${String(h).padStart(2, '0')}:00`;
            const endStr = `${String(Math.min(23, h + 1)).padStart(2, '0')}:00`;
            openEditorModal(null, ds, startStr, endStr);
          });
        });

        stageEl.querySelectorAll('[data-scroll-watch]').forEach((scroller) => {
          scroller.addEventListener('scroll', () => {
            liquidDock.classList.add('scrolling');
            clearTimeout(state.scrollTimer);
            state.scrollTimer = setTimeout(() => {
              liquidDock.classList.remove('scrolling');
            }, 160);
          }, { passive: true });
        });
      }

      // ==================== LIQUID GLASS BAR PHYSICS ====================
      function updateLiquidPill(animateSquish = true) {
        if (state.searchOpen) return;
        const activeTab = liquidTabsEl.querySelector(`.liquid-tab[data-view="${state.view}"]`);
        if (!activeTab) return;

        const tabsRect = liquidTabsEl.getBoundingClientRect();
        const tabRect = activeTab.getBoundingClientRect();
        const x = tabRect.left - tabsRect.left;
        const w = tabRect.width;

        liquidPill.style.width = `${w}px`;
        liquidPill.style.transform = `translate3d(${x}px, 0, 0)`;

        if (animateSquish) {
          liquidPill.classList.remove('morphing');
          void liquidPill.offsetWidth;
          liquidPill.classList.add('morphing');
        }
      }

      function setView(viewName) {
        if (state.view === viewName) return;
        state.view = viewName;
        liquidTabsEl.querySelectorAll('.liquid-tab').forEach((tab) => {
          const isMatch = tab.getAttribute('data-view') === viewName;
          tab.classList.toggle('active', isMatch);
          tab.setAttribute('aria-selected', String(isMatch));
        });
        updateLiquidPill(true);
        render();
      }

      function bindSpecularLight() {
        document.addEventListener('pointermove', (e) => {
          document.querySelectorAll('.liquid-surface').forEach((el) => {
            const rect = el.getBoundingClientRect();
            if (rect.width === 0) return;
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const near = mx > -80 && mx < rect.width + 80 && my > -80 && my < rect.height + 80;
            if (near) {
              el.style.setProperty('--mx', `${mx}px`);
              el.style.setProperty('--my', `${my}px`);
              el.style.setProperty('--sheen-o', '0.68');
            } else {
              el.style.setProperty('--sheen-o', '0.32');
            }
          });
        }, { passive: true });
      }

      let isScrubbing = false;
      let scrubStartX = 0;

      liquidTabsEl.addEventListener('pointerdown', (e) => {
        if (state.searchOpen) return;
        isScrubbing = true;
        scrubStartX = e.clientX;
        liquidTabsEl.setPointerCapture(e.pointerId);
      });

      liquidTabsEl.addEventListener('pointermove', (e) => {
        if (!isScrubbing || state.searchOpen) return;
        if (Math.abs(e.clientX - scrubStartX) < 6) return;

        const tabs = Array.from(liquidTabsEl.querySelectorAll('.liquid-tab'));
        const tabsRect = liquidTabsEl.getBoundingClientRect();
        const relX = e.clientX - tabsRect.left;

        let hoveredTab = tabs[0];
        let minDist = Infinity;
        tabs.forEach((tab) => {
          const r = tab.getBoundingClientRect();
          const center = (r.left - tabsRect.left) + r.width / 2;
          const dist = Math.abs(relX - center);
          if (dist < minDist) {
            minDist = dist;
            hoveredTab = tab;
          }
        });

        liquidPill.classList.add('dragging');
        const pillW = hoveredTab.getBoundingClientRect().width;
        const clampedX = Math.max(0, Math.min(tabsRect.width - pillW, relX - pillW / 2));
        liquidPill.style.width = `${pillW}px`;
        liquidPill.style.transform = `translate3d(${clampedX}px, 0, 0) scaleX(1.06) scaleY(0.95)`;

        const targetView = hoveredTab.getAttribute('data-view');
        if (targetView && targetView !== state.view) {
          state.view = targetView;
          tabs.forEach((t) => {
            const active = t.getAttribute('data-view') === targetView;
            t.classList.toggle('active', active);
            t.setAttribute('aria-selected', String(active));
          });
          render();
        }
      });

      function endScrub() {
        if (!isScrubbing) return;
        isScrubbing = false;
        liquidPill.classList.remove('dragging');
        updateLiquidPill(true);
      }

      liquidTabsEl.addEventListener('pointerup', endScrub);
      liquidTabsEl.addEventListener('pointercancel', endScrub);

      liquidTabsEl.querySelectorAll('.liquid-tab').forEach((tab) => {
        tab.addEventListener('click', () => {
          setView(tab.getAttribute('data-view'));
        });
      });

      // ==================== SEARCH MODE ====================
      function openSearch() {
        state.searchOpen = true;
        liquidDock.classList.add('search-mode');
        searchInput.value = state.searchQuery;
        renderSearchResults();
        setTimeout(() => searchInput.focus(), 40);
      }

      function closeSearch() {
        state.searchOpen = false;
        state.searchQuery = '';
        searchInput.value = '';
        liquidDock.classList.remove('search-mode');
        searchResultsPanel.classList.remove('open');
        requestAnimationFrame(() => updateLiquidPill(false));
      }

      function renderSearchResults() {
        const q = state.searchQuery.trim().toLowerCase();
        if (!q) {
          searchResultsPanel.classList.remove('open');
          return;
        }
        const matches = state.events
          .filter((ev) =>
            ev.title.toLowerCase().includes(q) ||
            (ev.location || '').toLowerCase().includes(q) ||
            (ev.notes || '').toLowerCase().includes(q)
          )
          .sort((a, b) => a.date.localeCompare(b.date));

        if (!matches.length) {
          searchResultsPanel.innerHTML = `<div class="search-empty">'${escapeHtml(q)}'에 해당하는 일정이 없습니다</div>`;
        } else {
          searchResultsPanel.innerHTML = matches.map((ev) => {
            const cat = CATEGORIES[ev.category] || CATEGORIES.work;
            const d = parseDateStr(ev.date);
            const dateTxt = `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEKDAYS_KO[d.getDay()]})`;
            const timeTxt = ev.allDay ? '하루 종일' : formatShortTime(ev.start);
            return `
              <button type="button" class="search-result-item" data-search-id="${ev.id}">
                <span class="event-dot" style="background:${cat.color}; width:7px; height:7px;"></span>
                <span class="agenda-info">
                  <span class="agenda-title" style="font-size:13.5px;">${escapeHtml(ev.title)}</span>
                  <span class="agenda-meta tabular">${dateTxt} · ${timeTxt}${ev.location ? ' · ' + escapeHtml(ev.location) : ''}</span>
                </span>
              </button>`;
          }).join('');

          searchResultsPanel.querySelectorAll('[data-search-id]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const ev = state.events.find((x) => x.id === btn.getAttribute('data-search-id'));
              if (!ev) return;
              state.cursor = parseDateStr(ev.date);
              state.selectedDate = ev.date;
              closeSearch();
              render();
              openDetailModal(ev.id);
            });
          });
        }
        searchResultsPanel.classList.add('open');
      }

      searchOrbBtn.addEventListener('click', () => {
        if (state.searchOpen) closeSearch();
        else openSearch();
      });

      searchCloseBtn.addEventListener('click', closeSearch);
      searchInput.addEventListener('input', (e) => {
        state.searchQuery = e.target.value;
        renderSearchResults();
      });

      // ==================== CALENDAR FILTER POPOVER ====================
      function updateFilterPopover() {
        const anyHidden = Object.values(state.visibleCategories).some((v) => !v);
        filterBtn.classList.toggle('has-filter', anyHidden);

        filterListEl.innerHTML = Object.values(CATEGORIES).map((cat) => {
          const checked = state.visibleCategories[cat.id];
          const count = state.events.filter((e) => e.category === cat.id).length;
          return `
            <button type="button" class="filter-row${checked ? ' checked' : ''}" data-cat="${cat.id}">
              <span class="filter-check" style="color:${cat.color}">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </span>
              <span>${cat.name}</span>
              <span class="filter-count tabular">${count}</span>
            </button>`;
        }).join('');

        filterListEl.querySelectorAll('.filter-row').forEach((row) => {
          row.addEventListener('click', () => {
            const catId = row.getAttribute('data-cat');
            state.visibleCategories[catId] = !state.visibleCategories[catId];
            render();
          });
        });
      }

      filterBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = filterPopover.classList.toggle('open');
        filterBtn.classList.toggle('active', isOpen);
      });

      document.addEventListener('click', (e) => {
        if (!filterPopover.contains(e.target) && !filterBtn.contains(e.target)) {
          filterPopover.classList.remove('open');
          filterBtn.classList.remove('active');
        }
      });

      // ==================== DAY OVERVIEW, DETAIL & EDITOR MODALS ====================
      function openDayOverviewModal(dateStr) {
        const d = parseDateStr(dateStr);
        const list = getEventsByDate(dateStr);
        dayOverviewTitle.textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${WEEKDAYS_KO[d.getDay()]}요일`;

        const listHtml = list.length
          ? list.map(renderAgendaCardHtml).join('')
          : `<div class="empty-state" style="padding:24px 12px;">이 날에 등록된 일정이 없습니다.</div>`;

        dayOverviewBody.innerHTML = `
          <div style="display:flex;flex-direction:column;gap:4px;">${listHtml}</div>
          <div class="detail-footer">
            <button type="button" class="btn-subtle" id="overviewAddBtn">이 날에 일정 추가</button>
          </div>`;

        dayOverviewBody.querySelectorAll('[data-event-id]').forEach((el) => {
          el.addEventListener('click', () => {
            closeDayOverviewModal();
            openDetailModal(el.getAttribute('data-event-id'));
          });
        });

        document.getElementById('overviewAddBtn').addEventListener('click', () => {
          closeDayOverviewModal();
          openEditorModal(null, dateStr);
        });

        dayOverviewBackdrop.classList.add('open');
      }

      function closeDayOverviewModal() {
        dayOverviewBackdrop.classList.remove('open');
      }

      function openDetailModal(id) {
        const ev = state.events.find((x) => x.id === id);
        if (!ev) return;
        state.detailId = id;
        const cat = CATEGORIES[ev.category] || CATEGORIES.work;
        const d = parseDateStr(ev.date);
        const dateFull = `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${WEEKDAYS_KO[d.getDay()]}요일`;
        const timeFull = ev.allDay ? '하루 종일' : `${formatTimeKo(ev.start)} – ${formatTimeKo(ev.end)}`;

        detailBody.innerHTML = `
          <div class="detail-head">
            <span class="detail-bar" style="background:${cat.color}"></span>
            <div>
              <h2 class="detail-title" id="detailTitle">${escapeHtml(ev.title)}</h2>
              <div class="detail-cat">${cat.name} 캘린더</div>
            </div>
          </div>
          <div class="detail-meta-list">
            <div class="detail-meta-row">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
              <div class="tabular">${dateFull}<br><span style="color:var(--text-secondary)">${timeFull}</span></div>
            </div>
            ${ev.location ? `
            <div class="detail-meta-row">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <div>${escapeHtml(ev.location)}</div>
            </div>` : ''}
            ${ev.notes ? `
            <div class="detail-meta-row">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
              <div class="detail-notes">${escapeHtml(ev.notes)}</div>
            </div>` : ''}
          </div>
          <div class="detail-footer">
            <button type="button" class="btn-subtle btn-danger" id="detailDeleteBtn">삭제</button>
            <button type="button" class="btn-subtle" id="detailEditBtn">편집</button>
          </div>`;

        document.getElementById('detailEditBtn').addEventListener('click', () => {
          closeDetailModal();
          openEditorModal(ev.id);
        });

        document.getElementById('detailDeleteBtn').addEventListener('click', () => {
          deleteEvent(ev.id);
          closeDetailModal();
        });

        detailBackdrop.classList.add('open');
      }

      function closeDetailModal() {
        detailBackdrop.classList.remove('open');
        state.detailId = null;
      }

      function renderCatPills() {
        catPillsEl.innerHTML = Object.values(CATEGORIES).map((cat) => `
          <button type="button" class="cat-pill${state.editorCategory === cat.id ? ' active' : ''}" data-pick-cat="${cat.id}" style="color:${state.editorCategory === cat.id ? cat.color : ''}">
            <span class="event-dot" style="background:${cat.color}; width:7px; height:7px;"></span>
            <span>${cat.name}</span>
          </button>`).join('');

        catPillsEl.querySelectorAll('[data-pick-cat]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.editorCategory = btn.getAttribute('data-pick-cat');
            renderCatPills();
          });
        });
      }

      function setAllDayUI(isAllDay) {
        state.editorAllDay = isAllDay;
        fieldAllDay.classList.toggle('on', isAllDay);
        fieldAllDay.setAttribute('aria-checked', String(isAllDay));
        startTimeRow.style.display = isAllDay ? 'none' : 'flex';
        endTimeRow.style.display = isAllDay ? 'none' : 'flex';
      }

      function openEditorModal(id = null, defaultDate = null, defaultStart = '10:00', defaultEnd = '11:00', defaultCat = 'work') {
        state.editingId = id;
        const existing = id ? state.events.find((x) => x.id === id) : null;

        if (existing) {
          editorSheetTitle.textContent = '일정 편집';
          fieldTitle.value = existing.title;
          fieldDate.value = existing.date;
          fieldStart.value = existing.start || '10:00';
          fieldEnd.value = existing.end || '11:00';
          fieldLocation.value = existing.location || '';
          fieldNotes.value = existing.notes || '';
          state.editorCategory = existing.category || 'work';
          setAllDayUI(Boolean(existing.allDay));
        } else {
          editorSheetTitle.textContent = '새로운 일정';
          fieldTitle.value = '';
          fieldDate.value = defaultDate || state.selectedDate || TODAY_STR;
          fieldStart.value = defaultStart;
          fieldEnd.value = defaultEnd;
          fieldLocation.value = '';
          fieldNotes.value = '';
          state.editorCategory = defaultCat || 'work';
          setAllDayUI(false);
        }

        renderCatPills();
        editorBackdrop.classList.add('open');
        setTimeout(() => fieldTitle.focus(), 60);
      }

      function closeEditorModal() {
        editorBackdrop.classList.remove('open');
        state.editingId = null;
      }

      function deleteEvent(id) {
        const idx = state.events.findIndex((x) => x.id === id);
        if (idx === -1) return;
        const [removed] = state.events.splice(idx, 1);
        state.lastDeleted = removed;
        saveState();
        render();
        showUndoToast(`'${removed.title}' 일정이 삭제되었습니다`);
      }

      function showUndoToast(msg) {
        toastMsg.textContent = msg;
        undoToast.classList.add('show');
        clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(() => {
          undoToast.classList.remove('show');
          state.lastDeleted = null;
        }, 4500);
      }

      undoBtn.addEventListener('click', () => {
        if (!state.lastDeleted) return;
        state.events.push(state.lastDeleted);
        state.lastDeleted = null;
        clearTimeout(state.toastTimer);
        undoToast.classList.remove('show');
        saveState();
        render();
      });

      fieldAllDay.addEventListener('click', () => setAllDayUI(!state.editorAllDay));

      eventForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const title = fieldTitle.value.trim();
        if (!title) return;

        let start = fieldStart.value || '10:00';
        let end = fieldEnd.value || '11:00';
        if (!state.editorAllDay && timeToMinutes(end) <= timeToMinutes(start)) {
          const endM = Math.min(23 * 60 + 55, timeToMinutes(start) + 60);
          end = `${String(Math.floor(endM / 60)).padStart(2, '0')}:${String(endM % 60).padStart(2, '0')}`;
        }

        const payload = {
          id: state.editingId || `ev-${Date.now()}`,
          title,
          date: fieldDate.value,
          start: state.editorAllDay ? '' : start,
          end: state.editorAllDay ? '' : end,
          allDay: state.editorAllDay,
          category: state.editorCategory,
          location: fieldLocation.value.trim(),
          notes: fieldNotes.value.trim()
        };

        if (state.editingId) {
          const idx = state.events.findIndex((x) => x.id === state.editingId);
          if (idx !== -1) state.events[idx] = payload;
        } else {
          state.events.push(payload);
        }

        state.visibleCategories[payload.category] = true;
        state.selectedDate = payload.date;
        saveState();
        closeEditorModal();
        render();
      });

      // ==================== NAVIGATION & CONTROLS ====================
      function stepPeriod(dir) {
        if (state.view === 'month' || state.view === 'agenda') {
          state.cursor = new Date(state.cursor.getFullYear(), state.cursor.getMonth() + dir, 1);
        } else if (state.view === 'week') {
          state.cursor = addDays(state.cursor, dir * 7);
        } else if (state.view === 'day') {
          state.cursor = addDays(state.cursor, dir);
        }
        render();
      }

      prevBtn.addEventListener('click', () => stepPeriod(-1));
      nextBtn.addEventListener('click', () => stepPeriod(1));
      todayBtn.addEventListener('click', () => {
        state.cursor = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
        state.selectedDate = TODAY_STR;
        render();
      });

      addOrbBtn.addEventListener('click', () => openEditorModal(null, state.selectedDate));
      brandLogoBtn.addEventListener('click', () => setView('home'));
      dayOverviewCloseBtn.addEventListener('click', closeDayOverviewModal);
      detailCloseBtn.addEventListener('click', closeDetailModal);
      editorCancelBtn.addEventListener('click', closeEditorModal);

      dayOverviewBackdrop.addEventListener('click', (e) => {
        if (e.target === dayOverviewBackdrop) closeDayOverviewModal();
      });
      detailBackdrop.addEventListener('click', (e) => {
        if (e.target === detailBackdrop) closeDetailModal();
      });
      editorBackdrop.addEventListener('click', (e) => {
        if (e.target === editorBackdrop) closeEditorModal();
      });

      themeBtn.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        applyTheme(current === 'dark' ? 'light' : 'dark', true);
      });

      document.addEventListener('keydown', (e) => {
        const tag = (e.target && e.target.tagName) || '';
        const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';

        if (e.key === 'Escape') {
          if (editorBackdrop.classList.contains('open')) closeEditorModal();
          else if (detailBackdrop.classList.contains('open')) closeDetailModal();
          else if (dayOverviewBackdrop.classList.contains('open')) closeDayOverviewModal();
          else if (state.searchOpen) closeSearch();
          else filterPopover.classList.remove('open');
          return;
        }

        if (isTyping) return;

        if (e.key === 'ArrowLeft' && state.view !== 'home') stepPeriod(-1);
        else if (e.key === 'ArrowRight' && state.view !== 'home') stepPeriod(1);
        else if (e.key === 't' || e.key === 'T') todayBtn.click();
        else if (e.key === 'n' || e.key === 'N') openEditorModal(null, state.selectedDate);
        else if (e.key === '/') { e.preventDefault(); openSearch(); }
        else if (e.key === '1') setView('home');
        else if (e.key === '2') setView('month');
        else if (e.key === '3') setView('week');
        else if (e.key === '4') setView('day');
        else if (e.key === '5') setView('agenda');
      });

      window.addEventListener('resize', () => updateLiquidPill(false));

      loadTheme();
      loadState();
      bindSpecularLight();
      render();
      requestAnimationFrame(() => updateLiquidPill(false));
    })();
  </script>
</body>
</html>
