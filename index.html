          <div class="day-view">
            <div class="day-main">
              ${allDayBarHtml}
              <div class="timegrid-scroll" id="timegridScroll" data-scroll-watch>
                <div class="day-timegrid-body">
                  <div class="time-gutter">${gutterHtml}</div>
                  <div class="time-col" style="border-right:none;">${slotsHtml}${evBlocks}${nowLineHtml}</div>
                </div>
              </div>
            </div>
            <aside class="day-aside" data-scroll-watch>
              <div>
                <div class="mini-cal-header">
                  <span class="mini-cal-title tabular">${y}년 ${m + 1}월</span>
                </div>
                <div class="mini-cal-grid">${miniCells}</div>
              </div>
              <div>
                <div class="aside-section-title">이날의 일정 (${dayEvents.length})</div>
                ${asideListHtml}
              </div>
            </aside>
          </div>`;

        bindStageEvents();
        const scroller = document.getElementById('timegridScroll');
        if (scroller) scroller.scrollTop = 450;
      }

      function renderAgendaCardHtml(ev) {
        const cat = CATEGORIES[ev.category] || CATEGORIES.work;
        const timeCol = ev.allDay
          ? `<span>하루 종일</span>`
          : `<span class="tabular">${formatShortTime(ev.start)}</span><span class="tabular" style="opacity:0.65">${formatShortTime(ev.end)}</span>`;
        const metaParts = [cat.name];
        if (ev.location) metaParts.push(ev.location);
        return `
          <button type="button" class="agenda-card" data-event-id="${ev.id}">
            <span class="agenda-bar" style="background:${cat.color}"></span>
            <span class="agenda-time">${timeCol}</span>
            <span class="agenda-info">
              <span class="agenda-title">${escapeHtml(ev.title)}</span>
              <span class="agenda-meta">${escapeHtml(metaParts.join(' · '))}</span>
            </span>
          </button>`;
      }

      function renderAgendaView() {
        const y = state.cursor.getFullYear();
        const m = state.cursor.getMonth();
        const monthPrefix = `${y}-${String(m + 1).padStart(2, '0')}`;
        const events = getVisibleEvents().filter((ev) => ev.date.startsWith(monthPrefix));

        const grouped = new Map();
        for (const ev of events) {
          if (!grouped.has(ev.date)) grouped.set(ev.date, []);
          grouped.get(ev.date).push(ev);
        }

        let contentHtml = '';
        if (grouped.size === 0) {
          contentHtml = `<div class="empty-state">${y}년 ${m + 1}월에 등록된 일정이 없습니다.<br><button type="button" class="home-empty-btn" id="agendaEmptyAddBtn" style="margin-top:14px;">새 일정 추가</button></div>`;
        } else {
          for (const [dateStr, list] of grouped.entries()) {
            const d = parseDateStr(dateStr);
            const isToday = dateStr === TODAY_STR;
            const headMain = `${d.getMonth() + 1}월 ${d.getDate()}일 ${WEEKDAYS_KO[d.getDay()]}요일`;
            const headSub = isToday ? '오늘' : '';
            contentHtml += `
              <section class="agenda-group">
                <div class="agenda-date-head${isToday ? ' is-today' : ''}">
                  <span class="agenda-date-main tabular">${headMain}</span>
                  ${headSub ? `<span class="agenda-date-sub">${headSub}</span>` : ''}
                </div>
                ${list.map(renderAgendaCardHtml).join('')}
              </section>`;
          }
        }

        stageEl.innerHTML = `
          <div class="agenda-view" data-scroll-watch>
            <div class="agenda-inner">${contentHtml}</div>
          </div>`;

        bindStageEvents();
        const addBtn = document.getElementById('agendaEmptyAddBtn');
        if (addBtn) {
          addBtn.addEventListener('click', () => openEditorModal(null, state.selectedDate));
        }
      }

      function render() {
        updateHeader();
        if (state.view === 'home') renderHomeView();
        else if (state.view === 'month') renderMonthView();
        else if (state.view === 'week') renderWeekView();
        else if (state.view === 'day') renderDayView();
        else renderAgendaView();

        updateFilterPopover();
        updateLiquidPill(false);
      }

      function bindStageEvents() {
        stageEl.querySelectorAll('[data-event-id]').forEach((el) => {
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            openDetailModal(el.getAttribute('data-event-id'));
          });
        });

        stageEl.querySelectorAll('[data-quick-add-date]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const ds = btn.getAttribute('data-quick-add-date');
            state.selectedDate = ds;
            openEditorModal(null, ds);
          });
        });

        stageEl.querySelectorAll('[data-more-date]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            openDayOverviewModal(btn.getAttribute('data-more-date'));
          });
        });

        stageEl.querySelectorAll('.day-cell').forEach((cell) => {
          cell.addEventListener('click', () => {
            const ds = cell.getAttribute('data-date');
            state.selectedDate = ds;
            const clicked = parseDateStr(ds);
            if (clicked.getMonth() !== state.cursor.getMonth()) {
              state.cursor = clicked;
            }
            renderMonthView();
          });
          cell.addEventListener('dblclick', () => {
            openEditorModal(null, cell.getAttribute('data-date'));
          });
        });

        stageEl.querySelectorAll('[data-jump-day]').forEach((el) => {
          el.addEventListener('click', () => {
            const ds = el.getAttribute('data-jump-day');
            state.cursor = parseDateStr(ds);
            state.selectedDate = ds;
            setView('day');
          });
        });

        stageEl.querySelectorAll('[data-slot-date]').forEach((slot) => {
          slot.addEventListener('click', () => {
            const ds = slot.getAttribute('data-slot-date');
            const h = Number(slot.getAttribute('data-slot-hour'));
            const startStr = `${String(h).padStart(2, '0')}:00`;
            const endStr = `${String(Math.min(23, h + 1)).padStart(2, '0')}:00`;
            openEditorModal(null, ds, startStr, endStr);
          });
        });

        stageEl.querySelectorAll('[data-scroll-watch]').forEach((scroller) => {
          scroller.addEventListener('scroll', () => {
            liquidDock.classList.add('scrolling');
            clearTimeout(state.scrollTimer);
            state.scrollTimer = setTimeout(() => {
              liquidDock.classList.remove('scrolling');
            }, 160);
          }, { passive: true });
        });
      }

      // ==================== LIQUID GLASS BAR PHYSICS ====================
      function updateLiquidPill(animateSquish = true) {
        if (state.searchOpen) return;
        const activeTab = liquidTabsEl.querySelector(`.liquid-tab[data-view="${state.view}"]`);
        if (!activeTab) return;

        const tabsRect = liquidTabsEl.getBoundingClientRect();
        const tabRect = activeTab.getBoundingClientRect();
        const x = tabRect.left - tabsRect.left;
        const w = tabRect.width;

        liquidPill.style.width = `${w}px`;
        liquidPill.style.transform = `translate3d(${x}px, 0, 0)`;

        if (animateSquish) {
          liquidPill.classList.remove('morphing');
          void liquidPill.offsetWidth;
          liquidPill.classList.add('morphing');
        }
      }

      function setView(viewName) {
        if (state.view === viewName) return;
        state.view = viewName;
        liquidTabsEl.querySelectorAll('.liquid-tab').forEach((tab) => {
          const isMatch = tab.getAttribute('data-view') === viewName;
          tab.classList.toggle('active', isMatch);
          tab.setAttribute('aria-selected', String(isMatch));
        });
        updateLiquidPill(true);
        render();
      }

      function bindSpecularLight() {
        document.addEventListener('pointermove', (e) => {
          document.querySelectorAll('.liquid-surface').forEach((el) => {
            const rect = el.getBoundingClientRect();
            if (rect.width === 0) return;
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const near = mx > -80 && mx < rect.width + 80 && my > -80 && my < rect.height + 80;
            if (near) {
              el.style.setProperty('--mx', `${mx}px`);
              el.style.setProperty('--my', `${my}px`);
              el.style.setProperty('--sheen-o', '0.68');
            } else {
              el.style.setProperty('--sheen-o', '0.32');
            }
          });
        }, { passive: true });
      }

      let isScrubbing = false;
      let scrubStartX = 0;

      liquidTabsEl.addEventListener('pointerdown', (e) => {
        if (state.searchOpen) return;
        isScrubbing = true;
        scrubStartX = e.clientX;
        liquidTabsEl.setPointerCapture(e.pointerId);
      });

      liquidTabsEl.addEventListener('pointermove', (e) => {
        if (!isScrubbing || state.searchOpen) return;
        if (Math.abs(e.clientX - scrubStartX) < 6) return;

        const tabs = Array.from(liquidTabsEl.querySelectorAll('.liquid-tab'));
        const tabsRect = liquidTabsEl.getBoundingClientRect();
        const relX = e.clientX - tabsRect.left;

        let hoveredTab = tabs[0];
        let minDist = Infinity;
        tabs.forEach((tab) => {
          const r = tab.getBoundingClientRect();
          const center = (r.left - tabsRect.left) + r.width / 2;
          const dist = Math.abs(relX - center);
          if (dist < minDist) {
            minDist = dist;
            hoveredTab = tab;
          }
        });

        liquidPill.classList.add('dragging');
        const pillW = hoveredTab.getBoundingClientRect().width;
        const clampedX = Math.max(0, Math.min(tabsRect.width - pillW, relX - pillW / 2));
        liquidPill.style.width = `${pillW}px`;
        liquidPill.style.transform = `translate3d(${clampedX}px, 0, 0) scaleX(1.06) scaleY(0.95)`;

        const targetView = hoveredTab.getAttribute('data-view');
        if (targetView && targetView !== state.view) {
          state.view = targetView;
          tabs.forEach((t) => {
            const active = t.getAttribute('data-view') === targetView;
            t.classList.toggle('active', active);
            t.setAttribute('aria-selected', String(active));
          });
          render();
        }
      });

      function endScrub() {
        if (!isScrubbing) return;
        isScrubbing = false;
        liquidPill.classList.remove('dragging');
        updateLiquidPill(true);
      }

      liquidTabsEl.addEventListener('pointerup', endScrub);
      liquidTabsEl.addEventListener('pointercancel', endScrub);

      liquidTabsEl.querySelectorAll('.liquid-tab').forEach((tab) => {
        tab.addEventListener('click', () => {
          setView(tab.getAttribute('data-view'));
        });
      });

      // ==================== SEARCH MODE ====================
      function openSearch() {
        state.searchOpen = true;
        liquidDock.classList.add('search-mode');
        searchInput.value = state.searchQuery;
        renderSearchResults();
        setTimeout(() => searchInput.focus(), 40);
      }

      function closeSearch() {
        state.searchOpen = false;
        state.searchQuery = '';
        searchInput.value = '';
        liquidDock.classList.remove('search-mode');
        searchResultsPanel.classList.remove('open');
        requestAnimationFrame(() => updateLiquidPill(false));
      }

      function renderSearchResults() {
        const q = state.searchQuery.trim().toLowerCase();
        if (!q) {
          searchResultsPanel.classList.remove('open');
          return;
        }
        const matches = state.events
          .filter((ev) =>
            ev.title.toLowerCase().includes(q) ||
            (ev.location || '').toLowerCase().includes(q) ||
            (ev.notes || '').toLowerCase().includes(q)
          )
          .sort((a, b) => a.date.localeCompare(b.date));

        if (!matches.length) {
          searchResultsPanel.innerHTML = `<div class="search-empty">'${escapeHtml(q)}'에 해당하는 일정이 없습니다</div>`;
        } else {
          searchResultsPanel.innerHTML = matches.map((ev) => {
            const cat = CATEGORIES[ev.category] || CATEGORIES.work;
            const d = parseDateStr(ev.date);
            const dateTxt = `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEKDAYS_KO[d.getDay()]})`;
            const timeTxt = ev.allDay ? '하루 종일' : formatShortTime(ev.start);
            return `
              <button type="button" class="search-result-item" data-search-id="${ev.id}">
                <span class="event-dot" style="background:${cat.color}; width:7px; height:7px;"></span>
                <span class="agenda-info">
                  <span class="agenda-title" style="font-size:13.5px;">${escapeHtml(ev.title)}</span>
                  <span class="agenda-meta tabular">${dateTxt} · ${timeTxt}${ev.location ? ' · ' + escapeHtml(ev.location) : ''}</span>
                </span>
              </button>`;
          }).join('');

          searchResultsPanel.querySelectorAll('[data-search-id]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const ev = state.events.find((x) => x.id === btn.getAttribute('data-search-id'));
              if (!ev) return;
              state.cursor = parseDateStr(ev.date);
              state.selectedDate = ev.date;
              closeSearch();
              render();
              openDetailModal(ev.id);
            });
          });
        }
        searchResultsPanel.classList.add('open');
      }

      searchOrbBtn.addEventListener('click', () => {
        if (state.searchOpen) closeSearch();
        else openSearch();
      });

      searchCloseBtn.addEventListener('click', closeSearch);
      searchInput.addEventListener('input', (e) => {
        state.searchQuery = e.target.value;
        renderSearchResults();
      });

      // ==================== CALENDAR FILTER POPOVER ====================
      function updateFilterPopover() {
        const anyHidden = Object.values(state.visibleCategories).some((v) => !v);
        filterBtn.classList.toggle('has-filter', anyHidden);

        filterListEl.innerHTML = Object.values(CATEGORIES).map((cat) => {
          const checked = state.visibleCategories[cat.id];
          const count = state.events.filter((e) => e.category === cat.id).length;
          return `
            <button type="button" class="filter-row${checked ? ' checked' : ''}" data-cat="${cat.id}">
              <span class="filter-check" style="color:${cat.color}">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </span>
              <span>${cat.name}</span>
              <span class="filter-count tabular">${count}</span>
            </button>`;
        }).join('');

        filterListEl.querySelectorAll('.filter-row').forEach((row) => {
          row.addEventListener('click', () => {
            const catId = row.getAttribute('data-cat');
            state.visibleCategories[catId] = !state.visibleCategories[catId];
            render();
          });
        });
      }

      filterBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = filterPopover.classList.toggle('open');
        filterBtn.classList.toggle('active', isOpen);
      });

      document.addEventListener('click', (e) => {
        if (!filterPopover.contains(e.target) && !filterBtn.contains(e.target)) {
          filterPopover.classList.remove('open');
          filterBtn.classList.remove('active');
        }
      });

      // ==================== DAY OVERVIEW, DETAIL & EDITOR MODALS ====================
      function openDayOverviewModal(dateStr) {
        const d = parseDateStr(dateStr);
        const list = getEventsByDate(dateStr);
        dayOverviewTitle.textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${WEEKDAYS_KO[d.getDay()]}요일`;

        const listHtml = list.length
          ? list.map(renderAgendaCardHtml).join('')
          : `<div class="empty-state" style="padding:24px 12px;">이 날에 등록된 일정이 없습니다.</div>`;

        dayOverviewBody.innerHTML = `
          <div style="display:flex;flex-direction:column;gap:4px;">${listHtml}</div>
          <div class="detail-footer">
            <button type="button" class="btn-subtle" id="overviewAddBtn">이 날에 일정 추가</button>
          </div>`;

        dayOverviewBody.querySelectorAll('[data-event-id]').forEach((el) => {
          el.addEventListener('click', () => {
            closeDayOverviewModal();
            openDetailModal(el.getAttribute('data-event-id'));
          });
        });

        document.getElementById('overviewAddBtn').addEventListener('click', () => {
          closeDayOverviewModal();
          openEditorModal(null, dateStr);
        });

        dayOverviewBackdrop.classList.add('open');
      }

      function closeDayOverviewModal() {
        dayOverviewBackdrop.classList.remove('open');
      }

      function openDetailModal(id) {
        const ev = state.events.find((x) => x.id === id);
        if (!ev) return;
        state.detailId = id;
        const cat = CATEGORIES[ev.category] || CATEGORIES.work;
        const d = parseDateStr(ev.date);
        const dateFull = `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${WEEKDAYS_KO[d.getDay()]}요일`;
        const timeFull = ev.allDay ? '하루 종일' : `${formatTimeKo(ev.start)} – ${formatTimeKo(ev.end)}`;

        detailBody.innerHTML = `
          <div class="detail-head">
            <span class="detail-bar" style="background:${cat.color}"></span>
            <div>
              <h2 class="detail-title" id="detailTitle">${escapeHtml(ev.title)}</h2>
              <div class="detail-cat">${cat.name} 캘린더</div>
            </div>
          </div>
          <div class="detail-meta-list">
            <div class="detail-meta-row">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
              <div class="tabular">${dateFull}<br><span style="color:var(--text-secondary)">${timeFull}</span></div>
            </div>
            ${ev.location ? `
            <div class="detail-meta-row">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <div>${escapeHtml(ev.location)}</div>
            </div>` : ''}
            ${ev.notes ? `
            <div class="detail-meta-row">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
              <div class="detail-notes">${escapeHtml(ev.notes)}</div>
            </div>` : ''}
          </div>
          <div class="detail-footer">
            <button type="button" class="btn-subtle btn-danger" id="detailDeleteBtn">삭제</button>
            <button type="button" class="btn-subtle" id="detailEditBtn">편집</button>
          </div>`;

        document.getElementById('detailEditBtn').addEventListener('click', () => {
          closeDetailModal();
          openEditorModal(ev.id);
        });

        document.getElementById('detailDeleteBtn').addEventListener('click', () => {
          deleteEvent(ev.id);
          closeDetailModal();
        });

        detailBackdrop.classList.add('open');
      }

      function closeDetailModal() {
        detailBackdrop.classList.remove('open');
        state.detailId = null;
      }

      function renderCatPills() {
        catPillsEl.innerHTML = Object.values(CATEGORIES).map((cat) => `
          <button type="button" class="cat-pill${state.editorCategory === cat.id ? ' active' : ''}" data-pick-cat="${cat.id}" style="color:${state.editorCategory === cat.id ? cat.color : ''}">
            <span class="event-dot" style="background:${cat.color}; width:7px; height:7px;"></span>
            <span>${cat.name}</span>
          </button>`).join('');

        catPillsEl.querySelectorAll('[data-pick-cat]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.editorCategory = btn.getAttribute('data-pick-cat');
            renderCatPills();
          });
        });
      }

      function setAllDayUI(isAllDay) {
        state.editorAllDay = isAllDay;
        fieldAllDay.classList.toggle('on', isAllDay);
        fieldAllDay.setAttribute('aria-checked', String(isAllDay));
        startTimeRow.style.display = isAllDay ? 'none' : 'flex';
        endTimeRow.style.display = isAllDay ? 'none' : 'flex';
      }

      function openEditorModal(id = null, defaultDate = null, defaultStart = '10:00', defaultEnd = '11:00', defaultCat = 'work') {
        state.editingId = id;
        const existing = id ? state.events.find((x) => x.id === id) : null;

        if (existing) {
          editorSheetTitle.textContent = '일정 편집';
          fieldTitle.value = existing.title;
          fieldDate.value = existing.date;
          fieldStart.value = existing.start || '10:00';
          fieldEnd.value = existing.end || '11:00';
          fieldLocation.value = existing.location || '';
          fieldNotes.value = existing.notes || '';
          state.editorCategory = existing.category || 'work';
          setAllDayUI(Boolean(existing.allDay));
        } else {
          editorSheetTitle.textContent = '새로운 일정';
          fieldTitle.value = '';
          fieldDate.value = defaultDate || state.selectedDate || TODAY_STR;
          fieldStart.value = defaultStart;
          fieldEnd.value = defaultEnd;
          fieldLocation.value = '';
          fieldNotes.value = '';
          state.editorCategory = defaultCat || 'work';
          setAllDayUI(false);
        }

        renderCatPills();
        editorBackdrop.classList.add('open');
        setTimeout(() => fieldTitle.focus(), 60);
      }

      function closeEditorModal() {
        editorBackdrop.classList.remove('open');
        state.editingId = null;
      }

      function deleteEvent(id) {
        const idx = state.events.findIndex((x) => x.id === id);
        if (idx === -1) return;
        const [removed] = state.events.splice(idx, 1);
        state.lastDeleted = removed;
        saveState();
        render();
        showUndoToast(`'${removed.title}' 일정이 삭제되었습니다`);
      }

      function showUndoToast(msg) {
        toastMsg.textContent = msg;
        undoToast.classList.add('show');
        clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(() => {
          undoToast.classList.remove('show');
          state.lastDeleted = null;
        }, 4500);
      }

      undoBtn.addEventListener('click', () => {
        if (!state.lastDeleted) return;
        state.events.push(state.lastDeleted);
        state.lastDeleted = null;
        clearTimeout(state.toastTimer);
        undoToast.classList.remove('show');
        saveState();
        render();
      });

      fieldAllDay.addEventListener('click', () => setAllDayUI(!state.editorAllDay));

      eventForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const title = fieldTitle.value.trim();
        if (!title) return;

        let start = fieldStart.value || '10:00';
        let end = fieldEnd.value || '11:00';
        if (!state.editorAllDay && timeToMinutes(end) <= timeToMinutes(start)) {
          const endM = Math.min(23 * 60 + 55, timeToMinutes(start) + 60);
          end = `${String(Math.floor(endM / 60)).padStart(2, '0')}:${String(endM % 60).padStart(2, '0')}`;
        }

        const payload = {
          id: state.editingId || `ev-${Date.now()}`,
          title,
          date: fieldDate.value,
          start: state.editorAllDay ? '' : start,
          end: state.editorAllDay ? '' : end,
          allDay: state.editorAllDay,
          category: state.editorCategory,
          location: fieldLocation.value.trim(),
          notes: fieldNotes.value.trim()
        };

        if (state.editingId) {
          const idx = state.events.findIndex((x) => x.id === state.editingId);
          if (idx !== -1) state.events[idx] = payload;
        } else {
          state.events.push(payload);
        }

        state.visibleCategories[payload.category] = true;
        state.selectedDate = payload.date;
        saveState();
        closeEditorModal();
        render();
      });

      // ==================== NAVIGATION & CONTROLS ====================
      function stepPeriod(dir) {
        if (state.view === 'month' || state.view === 'agenda') {
          state.cursor = new Date(state.cursor.getFullYear(), state.cursor.getMonth() + dir, 1);
        } else if (state.view === 'week') {
          state.cursor = addDays(state.cursor, dir * 7);
        } else if (state.view === 'day') {
          state.cursor = addDays(state.cursor, dir);
        }
        render();
      }

      prevBtn.addEventListener('click', () => stepPeriod(-1));
      nextBtn.addEventListener('click', () => stepPeriod(1));
      todayBtn.addEventListener('click', () => {
        state.cursor = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
        state.selectedDate = TODAY_STR;
        render();
      });

      addOrbBtn.addEventListener('click', () => openEditorModal(null, state.selectedDate));
      dayOverviewCloseBtn.addEventListener('click', closeDayOverviewModal);
      detailCloseBtn.addEventListener('click', closeDetailModal);
      editorCancelBtn.addEventListener('click', closeEditorModal);

      dayOverviewBackdrop.addEventListener('click', (e) => {
        if (e.target === dayOverviewBackdrop) closeDayOverviewModal();
      });
      detailBackdrop.addEventListener('click', (e) => {
        if (e.target === detailBackdrop) closeDetailModal();
      });
      editorBackdrop.addEventListener('click', (e) => {
        if (e.target === editorBackdrop) closeEditorModal();
      });

      themeBtn.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        applyTheme(current === 'dark' ? 'light' : 'dark', true);
      });

      document.addEventListener('keydown', (e) => {
        const tag = (e.target && e.target.tagName) || '';
        const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';

        if (e.key === 'Escape') {
          if (editorBackdrop.classList.contains('open')) closeEditorModal();
          else if (detailBackdrop.classList.contains('open')) closeDetailModal();
          else if (dayOverviewBackdrop.classList.contains('open')) closeDayOverviewModal();
          else if (state.searchOpen) closeSearch();
          else filterPopover.classList.remove('open');
          return;
        }

        if (isTyping) return;

        if (e.key === 'ArrowLeft' && state.view !== 'home') stepPeriod(-1);
        else if (e.key === 'ArrowRight' && state.view !== 'home') stepPeriod(1);
        else if (e.key === 't' || e.key === 'T') todayBtn.click();
        else if (e.key === 'n' || e.key === 'N') openEditorModal(null, state.selectedDate);
        else if (e.key === '/') { e.preventDefault(); openSearch(); }
        else if (e.key === '1') setView('home');
        else if (e.key === '2') setView('month');
        else if (e.key === '3') setView('week');
        else if (e.key === '4') setView('day');
        else if (e.key === '5') setView('agenda');
      });

      window.addEventListener('resize', () => updateLiquidPill(false));

      loadTheme();
      loadState();
      bindSpecularLight();
      render();
      requestAnimationFrame(() => updateLiquidPill(false));
    })();
  </script>
</body>
</html>
